name: sgaec-demo-maire

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.demo.maire}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.demo.maire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.demo.maire}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env.demo.maire}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - demo_pgdata_restricted:/var/lib/postgresql/data
      - ./ops/postgres/01-init-app.sql:/docker-entrypoint-initdb.d/01-init-app.sql:ro
    networks: [private]

  data:
    build: ./apps/data
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in .env.demo.maire}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env.demo.maire}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [private]

  migrate:
    build: ./apps/data
    profiles: [maintenance]
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.demo.maire}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  seed:
    build: ./apps/data
    profiles: [maintenance]
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in .env.demo.maire}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?set BOOTSTRAP_ADMIN_USERNAME in .env.demo.maire}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env.demo.maire}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    build: ./apps/api
    environment:
      APP_MODE: demo
      DATA_SERVICE_URL: http://data:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env.demo.maire}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.demo.maire}
      JWT_ISSUER: sgaec-api
      JWT_AUDIENCE: sgaec-web
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-30}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      data:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  demo_pgdata_restricted:
